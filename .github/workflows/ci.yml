name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q skills/ src/ tests/

      - name: Run provider-free agent end-to-end contract
        run: pytest tests/test_agent_end_to_end.py -v

      - name: Run pytest
        run: pytest tests/ -v

  # 별도 잡: wheel build → 격리 venv install → 번들 스킬 디스커버리 sanity.
  # editable install에선 안 보이는 패키징 회귀(예: 이슈 #7 "사용 가능한 스킬 없음")를
  # 영구 차단한다. ubuntu 한 OS만으로 충분 — packaging 동작은 OS 무관.
  wheel-install-smoke:
    name: wheel install smoke (ubuntu / py3.12)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Install in isolated venv
        run: |
          python -m venv /tmp/smoke-env
          /tmp/smoke-env/bin/pip install dist/*.whl

      - name: heartbeat skills must list dream
        run: |
          out=$(/tmp/smoke-env/bin/heartbeat skills)
          echo "$out"
          echo "$out" | grep -q "dream" || (echo "::error::dream skill not discovered in wheel install" && exit 1)

      - name: dream-prep CLI must work
        run: /tmp/smoke-env/bin/dream-prep --help

  runtime-package:
    name: standalone runtime (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install standalone build dependencies
        if: runner.os != 'macOS'
        run: pip install -e ".[build,dev]"

      - name: Install macOS universal build dependencies
        if: runner.os == 'macOS'
        env:
          ARCHFLAGS: -arch arm64 -arch x86_64
        run: |
          python -m pip install --no-binary=psutil,watchdog -e ".[build,dev]"
          python - <<'PY'
          from pathlib import Path
          import subprocess, sysconfig

          library = Path(sysconfig.get_config_var("LIBDIR")) / sysconfig.get_config_var("LDLIBRARY")
          architectures = subprocess.check_output(["lipo", "-archs", str(library)], text=True).split()
          if set(architectures) != {"arm64", "x86_64"}:
              raise SystemExit(f"Python is not universal2: {library} -> {architectures}")
          PY

      - name: Build one-folder runtime
        env:
          HEARTBEAT_MACOS_TARGET_ARCH: universal2
        run: pyinstaller packaging/heartbeat.spec --noconfirm --clean

      - name: Verify macOS universal slices and both contract paths
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test "$(lipo -archs dist/heartbeat/heartbeat)" = "x86_64 arm64" || \
            test "$(lipo -archs dist/heartbeat/heartbeat)" = "arm64 x86_64"
          psutil_binary="$(find dist/heartbeat -name '_psutil_osx*.so' -print -quit)"
          test -n "$psutil_binary"
          test "$(lipo -archs "$psutil_binary")" = "x86_64 arm64" || \
            test "$(lipo -archs "$psutil_binary")" = "arm64 x86_64"
          arch -arm64 dist/heartbeat/heartbeat agent contract >/dev/null
          arch -x86_64 dist/heartbeat/heartbeat agent contract >/dev/null

      - name: Write and verify artifact manifest
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
        run: |
          python -c "from heartbeat.legacy_migration import write_runtime_manifest; from pathlib import Path; import os; print(write_runtime_manifest(Path('dist/heartbeat'), target=os.environ['RUNTIME_TARGET']))"
          python -c "from pathlib import Path; import subprocess, sys; binary=Path('dist/heartbeat') / ('heartbeat.exe' if sys.platform == 'win32' else 'heartbeat'); subprocess.run([str(binary), 'runtime', 'verify-manifest', '--root', 'dist/heartbeat'], check=True); subprocess.run([str(binary), 'runtime', 'inspect'], check=True); subprocess.run([str(binary), 'agent', 'contract'], check=True)"
          python -c "from pathlib import Path; import os, zipfile; root=Path('dist/heartbeat'); target=os.environ['RUNTIME_TARGET']; archive=Path('dist') / f'heartbeat-{target}.zip'; z=zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED); [z.write(path, path.relative_to(root.parent)) for path in root.rglob('*') if path.is_file()]; z.close()"

      - name: Register, restart, and remove the platform service
        env:
          HEARTBEAT_SERVICE_SMOKE_BINARY: ${{ github.workspace }}/dist/heartbeat/heartbeat${{ runner.os == 'Windows' && '.exe' || '' }}
        run: pytest tests/test_agent_end_to_end.py::test_platform_service_registration_restart_and_cleanup -v

      - name: Upload standalone runtime
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-${{ matrix.target }}
          path: dist/heartbeat-${{ matrix.target }}.zip
          if-no-files-found: error

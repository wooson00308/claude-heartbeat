name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # POSIX 잡: 머지 게이트. 실패 시 빨간불.
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q skills/ src/ tests/

      - name: Run pytest
        run: pytest tests/ -v

  # Windows 잡: Phase 2(POSIX 의존 제거)까지 placeholder. 실패해도 워크플로우는 통과.
  # matrix include로 처리하면 continue-on-error 표현식이 코어싱 이슈로 sneaky하게
  # POSIX 잡까지 영향 줄 수 있어, 잡 자체를 분리해서 우회한다.
  test-windows-placeholder:
    name: pytest (windows-latest / py${{ matrix.python-version }}) [allowed to fail]
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest (POSIX-only tests are skipped via skipif)
        run: pytest tests/ -v

name: Release standalone runtime

on:
  push:
    tags: ["runtime-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-universal
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install standalone build dependencies
        run: pip install -e ".[build]"
      - name: Build and verify one-folder runtime
        env:
          RUNTIME_TARGET: ${{ matrix.target }}
          HEARTBEAT_MACOS_TARGET_ARCH: universal2
        run: |
          pyinstaller packaging/heartbeat.spec --noconfirm --clean
          python -c "from heartbeat.legacy_migration import write_runtime_manifest; from pathlib import Path; import os; print(write_runtime_manifest(Path('dist/heartbeat'), target=os.environ['RUNTIME_TARGET']))"
          python -c "from pathlib import Path; import subprocess, sys; binary=Path('dist/heartbeat') / ('heartbeat.exe' if sys.platform == 'win32' else 'heartbeat'); subprocess.run([str(binary), 'runtime', 'verify-manifest', '--root', 'dist/heartbeat'], check=True); subprocess.run([str(binary), 'agent', 'contract'], check=True)"
          python -c "from pathlib import Path; import os, zipfile; root=Path('dist/heartbeat'); target=os.environ['RUNTIME_TARGET']; archive=Path('dist') / f'heartbeat-{target}.zip'; z=zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED); [z.write(path, path.relative_to(root.parent)) for path in root.rglob('*') if path.is_file()]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: heartbeat-${{ matrix.target }}
          path: dist/heartbeat-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    needs: build-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish verified runtime archives
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**

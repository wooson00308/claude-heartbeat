[project]
name = "claude-heartbeat"
version = "0.5.0"
description = "Periodic claude agent scheduler — wake Claude on schedule, run skills automatically"
requires-python = ">=3.11"
dependencies = [
    "portalocker>=2.7",  # cross-platform file lock (replaces fcntl)
    "psutil>=5.9",       # cross-platform process tree termination
]

[project.optional-dependencies]
dream = []
notify = ["plyer>=2.1"]  # cross-platform desktop notifications (optional)
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartbeat", "skills"]

[project.scripts]
heartbeat = "heartbeat.cli:main"
dream-heartbeat = "heartbeat.cli:main"
dream-prep = "skills.dream.cli:main"
